[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "owsh"
version = "1.0.0"
description = "Open Walking Safety Helmet firmware: obstacle, drop-off and approach warnings, text reading, face recognition and SOS for blind and low-vision walkers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "CLSOFTLAB, Dr. Lee Il-guk" }]
keywords = ["assistive technology", "blind", "low vision", "raspberry pi", "lidar", "haptics", "accessibility"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Intended Audience :: Healthcare Industry",
]
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    # Desktop (PC simulator): pip wheel with GUI for the dashboard.
    # Raspberry Pi: scripts/setup_pi.sh installs opencv-python-headless (>= 4.8 is needed for
    # YuNet 2023mar; Bookworm's apt python3-opencv 4.6 is too old). Picamera2 comes from apt
    # (python3-picamera2) and is reached through a venv created with --system-site-packages.
    "opencv-python>=4.10; platform_machine != 'aarch64' and platform_machine != 'armv7l'",
]

[project.optional-dependencies]
pi = [
    "gpiozero>=2.0",
    "lgpio>=0.2.2.0",
    "smbus2>=0.4.3",
    # picamera2: install with `sudo apt install python3-picamera2` (not reliably pip-installable)
]
ble = ["bless>=0.2.6"]
ocr = ["rapidocr_onnxruntime>=1.3"]
desktop = ["pyttsx3>=2.90"]
dev = ["pytest>=7", "pyttsx3>=2.90", "smbus2>=0.4.3"]

[project.scripts]
owsh = "owsh.__main__:main"

[tool.setuptools.packages.find]
include = ["owsh*"]

[tool.setuptools.package-data]
owsh = ["i18n/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
