name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Firmware tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: firmware/pyproject.toml

      - name: Install system libraries for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install firmware with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e "firmware[dev]"

      - name: Run pytest
        working-directory: firmware
        run: pytest -q

  app:
    name: App tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run node tests
        working-directory: app
        run: node --test tests/*.test.mjs

  openscad:
    name: OpenSCAD render smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Render one part
        run: |
          openscad -o /tmp/x.stl hardware/openscad/strap_anchor.scad
          test -s /tmp/x.stl
